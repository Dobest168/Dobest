name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 3 * * *'   # 每天 UTC 03:00（北京时间 11:00）
  workflow_dispatch:      # 允许手动触发

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (auth + storage)
        run: |
          curl -s -o /dev/null -w "auth:%{http_code}\n" "${{ secrets.SUPABASE_URL }}/auth/v1/health"
          curl -s -o /dev/null -w "storage:%{http_code}\n" "${{ secrets.SUPABASE_URL }}/storage/v1/bucket" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}"
